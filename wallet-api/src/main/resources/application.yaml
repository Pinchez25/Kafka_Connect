server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: wallet-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/pesaflow}
    username: ${DB_USERNAME:pesaflow}
    password: ${DB_PASSWORD:pesaflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

pesaflow:
  wallet:
    currency: ${WALLET_CURRENCY:KES}
    zone-id: ${WALLET_ZONE_ID:Africa/Nairobi}
    daily-limits:
      BASIC: 70000
      FULL: 500000
  load-generator:
    enabled: ${LOAD_GENERATOR_ENABLED:false}
    interval: ${LOAD_GENERATOR_INTERVAL:1s}
    transactions-per-tick: ${LOAD_GENERATOR_TRANSACTIONS_PER_TICK:5}
    seed-accounts: 200
    seed-merchants: 30
    new-account-probability: 0.05
    mix:
      p2p: 6
      merchant-payment: 3
      top-up: 1
