spring:
  application:
    name: wallet-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5434/pesaflow
    username: pesaflow
    password: pesaflow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  kafka:
    bootstrap-servers: localhost:9092

pesaflow:
  wallet:
    currency: KES
    zone-id: Africa/Nairobi
    daily-limits:
      BASIC: 70000
      FULL: 500000
  load-generator:
    enabled: false
    interval: 1s
    transactions-per-tick: 5
    seed-accounts: 200
    seed-merchants: 30
    new-account-probability: 0.05
    mix:
      p2p: 6
      merchant-payment: 3
      top-up: 1
