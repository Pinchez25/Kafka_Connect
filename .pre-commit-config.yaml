# Install once: pre-commit install   (installs both the pre-commit and commit-msg hooks)
# Run on everything: pre-commit run --all-files
default_install_hook_types: [ pre-commit, commit-msg ]
default_stages: [ pre-commit ]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [ --markdown-linebreak-ext=md ]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [ --fix=lf ]
        exclude: \.bat$
      - id: check-yaml
        args: [ --allow-multiple-documents ]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [ --maxkb=1024 ]
      - id: check-executables-have-shebangs
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint-docker

  - repo: local
    hooks:
      # Formats in place; the commit stops so the changes can be reviewed and staged.
      - id: spotless
        name: spotless
        entry: ./gradlew spotlessApply --quiet
        language: system
        files: \.(java|kts|kt|md|ya?ml|sql|avdl|http|toml|json)$
        pass_filenames: false

      - id: commit-message
        name: 'commit message is type(scope): subject'
        language: pygrep
        entry: '\A((feat|fix|docs|test|refactor|perf|build|ci|chore|style|revert)\([a-z0-9-]+\): \S|Merge |Revert ")'
        args: [ --negate, --multiline ]
        stages: [ commit-msg ]
