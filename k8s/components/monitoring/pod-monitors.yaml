apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pesaflow-apps
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [ wallet-api, pesaflow-streams ]
  podMetricsEndpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
---
# Kafka brokers and Connect workers expose the JMX exporter on Strimzi's tcp-prometheus port.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pesaflow-kafka
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchExpressions:
      - key: strimzi.io/kind
        operator: In
        values: [ Kafka, KafkaConnect ]
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 15s
