apiVersion: v1
kind: ServiceAccount
metadata:
  name: wallet-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-api
data:
  SERVER_PORT: "8080"
  DB_URL: jdbc:postgresql://pesaflow-db-rw:5432/pesaflow
  WALLET_ZONE_ID: Africa/Nairobi
  # Every replica would run its own generator, so it stays off outside local clusters.
  LOAD_GENERATOR_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-api
  labels:
    app.kubernetes.io/name: wallet-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wallet-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wallet-api
    spec:
      serviceAccountName: wallet-api
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: wallet-api
      containers:
        - name: wallet-api
          image: ghcr.io/pinchez25/pesaflow-wallet-api:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: wallet-api
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pesaflow-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pesaflow-db-app
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Gives the endpoints controller time to stop routing here before Spring starts its graceful shutdown.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ ALL ]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-api
  labels:
    app.kubernetes.io/name: wallet-api
spec:
  selector:
    app.kubernetes.io/name: wallet-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wallet-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wallet-api
