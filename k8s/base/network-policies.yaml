# Default deny for ingress, then one allowance per conversation. Strimzi and CloudNativePG create their own
# policies or need the operator namespaces allowed explicitly; adjust the namespace labels to your cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [ Ingress ]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wallet-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wallet-api
  policyTypes: [ Ingress ]
  ingress:
    # Clients through the ingress controller.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: http
    # The fraud webhook, called by the HTTP sink connector.
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/kind: KafkaConnect
      ports:
        - port: http
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pesaflow-streams
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pesaflow-streams
  policyTypes: [ Ingress ]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: http
    # Instances forward interactive queries to whichever one owns the key.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pesaflow-streams
      ports:
        - port: http
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: schema-registry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
  policyTypes: [ Ingress ]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pesaflow-streams
        - podSelector:
            matchLabels:
              strimzi.io/kind: KafkaConnect
      ports:
        - port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pesaflow-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pesaflow-db
  policyTypes: [ Ingress ]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wallet-api
        - podSelector:
            matchLabels:
              strimzi.io/kind: KafkaConnect
      ports:
        - port: 5432
    # Replication between instances.
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: pesaflow-db
    # The CloudNativePG operator talks to each instance manager.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
