# Strimzi builds the Connect image itself from the plugin artifacts below and pushes it to output.image.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: pesaflow
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.1.0
  replicas: 2
  bootstrapServers: pesaflow-kafka-bootstrap:9092
  config:
    group.id: pesaflow-connect
    config.storage.topic: connect-configs
    offset.storage.topic: connect-offsets
    status.storage.topic: connect-status
    config.storage.replication.factor: 3
    offset.storage.replication.factor: 3
    status.storage.replication.factor: 3
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    exactly.once.source.support: enabled
    connector.client.config.override.policy: All
    # ${secrets:<namespace>/<secret>:<key>} in connector configs, resolved at runtime (see connect-rbac.yaml).
    config.providers: secrets
    config.providers.secrets.class: io.strimzi.kafka.KubernetesSecretConfigProvider
  build:
    output:
      type: docker
      image: ghcr.io/pinchez25/pesaflow-connect:latest
      pushSecret: ghcr-push
    # Pin a sha512sum on each artifact before relying on this in production.
    plugins:
      - name: debezium-postgres
        artifacts:
          - type: tgz
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/3.6.1.Final/debezium-connector-postgres-3.6.1.Final-plugin.tar.gz
      - name: debezium-jdbc
        artifacts:
          - type: tgz
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-jdbc/3.6.1.Final/debezium-connector-jdbc-3.6.1.Final-plugin.tar.gz
      - name: aiven-http-sink
        artifacts:
          - type: zip
            url: https://github.com/Aiven-Open/http-connector-for-apache-kafka/releases/download/v0.9.0/http-connector-for-apache-kafka-0.9.0.zip
      - name: confluent-avro-converter
        artifacts:
          - type: zip
            url: https://hub-downloads.confluent.io/api/plugins/confluentinc/kafka-connect-avro-converter/versions/8.2.0/confluentinc-kafka-connect-avro-converter-8.2.0.zip
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef:
        name: kafka-metrics
        key: connect-metrics.yaml
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 2Gi
