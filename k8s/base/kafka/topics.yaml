# Every topic the applications and connectors use. Kafka Streams' internal topics are created by Kafka Streams.
# spec.topicName carries the real name; resource names use dashes for consistency.
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: pesaflow-accounts
  labels:
    strimzi.io/cluster: pesaflow
spec:
  topicName: pesaflow.accounts
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: "2"
    cleanup.policy: "compact"
---
