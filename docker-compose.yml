# Kafka is reachable on localhost:9092 from the host and kafka:29092 from other containers.

name: pesaflow

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: bx1Va7aqQxG65qIUcKNMGw

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.0
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8081/subjects > /dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 10

  connect: &connect-worker
    build: ./connect
    image: pesaflow/connect:3.6.1
    hostname: connect
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bind-mounted: /kafka/config is a volume the image only fills when files are missing.
    volumes:
      - ./connect/metrics.yaml:/kafka/config/metrics.yaml:ro
    environment: &connect-environment
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: pesaflow-connect
      ADVERTISED_HOST_NAME: connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_EXACTLY_ONCE_SOURCE_SUPPORT: enabled
      CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: All
      ENABLE_JMX_EXPORTER: "true"
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      PESAFLOW_DB_PASSWORD: pesaflow
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  connect-2:
    <<: *connect-worker
    hostname: connect-2
    profiles: [ scale ]
    ports:
      - "8084:8083"
    environment:
      <<: *connect-environment
      ADVERTISED_HOST_NAME: connect-2

  postgres:
    image: postgres:18-alpine
    hostname: postgres
    command: [ "postgres", "-c", "wal_level=logical" ]
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: pesaflow
      POSTGRES_USER: pesaflow
      POSTGRES_PASSWORD: pesaflow
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pesaflow -d pesaflow" ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pesaflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [ observability ]
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.3.1
    profiles: [ observability ]
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  wallet-api:
    build:
      context: .
      args:
        MODULE: wallet-api
        PORT: 8080
    image: pesaflow/wallet-api:local
    profiles: [ apps ]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pesaflow
      DB_USERNAME: pesaflow
      DB_PASSWORD: pesaflow
      LOAD_GENERATOR_ENABLED: "false"

  pesaflow-streams:
    build:
      context: .
      args:
        MODULE: pesaflow-streams
        PORT: 8082
    image: pesaflow/pesaflow-streams:local
    profiles: [ apps ]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      STREAMS_ADVERTISED_HOST: pesaflow-streams
      STREAMS_STATE_DIR: /var/lib/pesaflow/streams
      STREAMS_STANDBY_REPLICAS: "0"
    volumes:
      - streams-state:/var/lib/pesaflow

volumes:
  kafka-data:
  postgres-data:
  streams-state:
