server:
  port: 8082

spring:
  application:
    name: pesaflow-streams
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    streams:
      application-id: pesaflow-streams
      state-dir: build/kafka-streams/${server.port}
      properties:
        # Lets every instance tell callers which host owns a key (interactive query routing).
        application.server: localhost:${server.port}
        # Connect writes with exactly-once transactions; don't read records from aborted ones.
        consumer.isolation.level: read_committed
        commit.interval.ms: 1000
        statestore.cache.max.bytes: 10485760

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

pesaflow:
  streams:
    schema-registry-url: http://localhost:8081
    topics:
      cdc-accounts: pesaflow.accounts
      cdc-merchants: pesaflow.merchants
      cdc-transactions: pesaflow.transactions
      p2p-transfers: pesaflow.transactions.p2p
      top-ups: pesaflow.transactions.top-up
      merchant-payments: pesaflow.transactions.merchant-payment
      enriched-transactions: pesaflow.transactions.enriched
      balances: pesaflow.balances
      transaction-senders: pesaflow.transactions.with-sender
      fraud-alerts: pesaflow.fraud.alerts
    output-topics:
      partitions: 3
      replication-factor: 1
    accounts-table:
      versioned: true
      history-retention: 30d
    activity:
      window: 1m
      grace: 30s
      retention: 1h
    fraud:
      zone-id: Africa/Nairobi
      transfer-velocity:
        window: 1m
        grace: 30s
        max-transfers: 5
      rolling-spend:
        window: 10m
        grace: 1m
        limit-fraction: 0.5
      new-account:
        max-age: 24h
        amount-threshold: 10000
      night-betting:
        start: "00:00"
        end: "05:00"
        inactivity-gap: 10m
        grace: 2m
        min-payments: 3
      round-trip:
        window: 5m
        grace: 1m
        max-amount-difference: 0.1
