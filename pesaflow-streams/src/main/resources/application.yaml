server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: pesaflow-streams
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: ${STREAMS_APPLICATION_ID:pesaflow-streams}
      state-dir: ${STREAMS_STATE_DIR:build/kafka-streams/${server.port}}
      properties:
        # Lets every instance tell callers which host owns a key (interactive query routing).
        application.server: ${STREAMS_ADVERTISED_HOST:localhost}:${server.port}
        processing.guarantee: ${STREAMS_PROCESSING_GUARANTEE:exactly_once_v2}
        # Connect writes with exactly-once transactions; don't read records from aborted ones (implied by exactly-once).
        consumer.isolation.level: read_committed
        commit.interval.ms: ${STREAMS_COMMIT_INTERVAL_MS:1000}
        statestore.cache.max.bytes: ${STREAMS_CACHE_MAX_BYTES:10485760}
        num.standby.replicas: ${STREAMS_STANDBY_REPLICAS:1}
        # A crashed instance's tasks move after this long; the 45 s default dominated failover time.
        consumer.session.timeout.ms: ${STREAMS_SESSION_TIMEOUT_MS:10000}
        consumer.heartbeat.interval.ms: 3000
        ensure.explicit.internal.resource.naming: true
        # Reusing pesaflow.accounts as the accounts changelog would restore versions with Connect's timestamps, not updated_at.
        topology.optimization: none
        errors.dead.letter.queue.topic.name: ${pesaflow.streams.topics.dead-letters}
        deserialization.exception.handler: com.pinchez.streams.handler.CdcDeserializationExceptionHandler
        processing.exception.handler: com.pinchez.streams.handler.BestEffortProcessingExceptionHandler
        production.exception.handler: com.pinchez.streams.handler.OversizedRecordProductionExceptionHandler

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

pesaflow:
  streams:
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    topics:
      cdc-accounts: pesaflow.accounts
      cdc-merchants: pesaflow.merchants
      cdc-transactions: pesaflow.transactions
      p2p-transfers: pesaflow.transactions.p2p
      top-ups: pesaflow.transactions.top-up
      merchant-payments: pesaflow.transactions.merchant-payment
      enriched-transactions: pesaflow.transactions.enriched
      balances: pesaflow.balances
      transaction-senders: pesaflow.transactions.with-sender
      fraud-alerts: pesaflow.fraud.alerts
      fraud-review: pesaflow.fraud.review
      dormant-accounts: pesaflow.accounts.dormant
      dead-letters: pesaflow.dlq.streams
    output-topics:
      partitions: ${OUTPUT_TOPIC_PARTITIONS:3}
      replication-factor: ${OUTPUT_TOPIC_REPLICATION_FACTOR:1}
    accounts-table:
      versioned: true
      history-retention: 30d
    activity:
      window: 1m
      grace: 30s
      retention: 1h
    deduplication:
      retention: ${DEDUPLICATION_RETENTION:7d}
    dormant-account:
      inactivity: ${DORMANT_ACCOUNT_INACTIVITY:30d}
      scan-interval: ${DORMANT_ACCOUNT_SCAN_INTERVAL:1m}
      punctuation-type: ${DORMANT_ACCOUNT_PUNCTUATION_TYPE:wall-clock-time}
    errors:
      max-thread-replacements: 3
      thread-replacement-window: 10m
    fraud:
      zone-id: ${FRAUD_ZONE_ID:Africa/Nairobi}
      transfer-velocity:
        window: 1m
        grace: 30s
        max-transfers: 5
      rolling-spend:
        window: 10m
        grace: 1m
        limit-fraction: 0.5
      new-account:
        max-age: 24h
        amount-threshold: 10000
      night-betting:
        start: "00:00"
        end: "05:00"
        inactivity-gap: 10m
        grace: 2m
        min-payments: 3
      round-trip:
        window: 5m
        grace: 1m
        max-amount-difference: 0.1
      unusual-amount:
        min-history: 10
        review-multiplier: 10
        high-multiplier: 20
