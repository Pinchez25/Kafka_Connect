name: End-to-end

# Several minutes of containers, so not on every pull request.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Whole pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :pesaflow-e2e:e2eTest
      - name: Upload application and Connect logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            pesaflow-e2e/build/e2e-logs/
            pesaflow-e2e/build/reports/tests/
          retention-days: 7
