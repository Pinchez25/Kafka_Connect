name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Every commit subject is type(scope): subject'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=$(git log --format=%s "$BASE..$HEAD" \
            | grep -Ev '^((feat|fix|docs|test|refactor|perf|build|ci|chore|style|revert)\([a-z0-9-]+\): |Merge |Revert ")' || true)
          if [ -n "$bad" ]; then
            echo "::error::These commit subjects do not follow type(scope): subject"
            echo "$bad"
            exit 1
          fi

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --continue
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUSTOMIZE_IMAGE: registry.k8s.io/kustomize/kustomize:v5.4.3
      KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.6.7
    steps:
      - uses: actions/checkout@v7
      - name: Render and validate each overlay
        run: |
          for overlay in local production; do
            echo "::group::$overlay"
            docker run --rm -v "$PWD/k8s:/k8s:ro" "$KUSTOMIZE_IMAGE" build "/k8s/overlays/$overlay" > "$overlay.yaml"
            docker run --rm -v "$PWD:/w:ro" "$KUBECONFORM_IMAGE" \
              -strict -summary -kubernetes-version 1.33.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "/w/$overlay.yaml"
            echo "::endgroup::"
          done

  e2e:
    name: End-to-end
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/e2e.yml

  images:
    name: Images
    needs: [ pre-commit, build, kubernetes, e2e ]
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.pre-commit.result == 'success'
      && needs.build.result == 'success'
      && needs.kubernetes.result == 'success'
      && (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && !startsWith(github.ref, 'refs/tags/')))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
