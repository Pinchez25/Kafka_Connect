global:
  scrape_interval: 10s

scrape_configs:
  - job_name: pesaflow-streams
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "host.docker.internal:8082" ]
  - job_name: wallet-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "host.docker.internal:8080" ]
  - job_name: kafka-connect
    static_configs:
      - targets: [ "connect:9404" ]
